<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Inner Ring Accent -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#facc15" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Outer Hexagonal Faceted Crown Frame -->
  <path d="M32 10L50 20.4V43.6L32 54L14 43.6V20.4L32 10Z" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Interlocking Dual Prism Lens -->
  <path d="M32 17.5L42.5 35.5H21.5L32 17.5Z" fill="url(#goldGrad)"/>
  <path d="M32 46.5L21.5 28.5H42.5L32 46.5Z" fill="#fef08a" opacity="0.75"/>

  <!-- Center Core Lens Sparkle Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
</svg>